# jobpile config. Copy this file to your data folder as config.toml and
# edit it there. Nothing in this file is secret; the remoet API key is
# resolved at runtime from REMOET_API_KEY or key_command below, never
# written here.

# The yearly USD floor. A listing with a salary skips if the top of its
# range falls under this; a listing with no salary always passes this
# check.
floor_usd = 80000

# How many units of each currency equal one USD. Used to convert a
# salary to yearly USD. Add a row for any currency you see often in
# skip.md with "no currency rate configured". Update occasionally; these
# are not pulled live.
[currency_rates]
USD = 1
EUR = 0.92
GBP = 0.79
CAD = 1.38
AUD = 1.52
INR = 83.0
PLN = 4.0

[title]
# A title must contain one of these...
senior_patterns = [
  "staff", "principal", "senior", "lead", "architect",
  "engineering manager", "head of engineering", "founding engineer",
]
# ...and one of these...
engineering_words = ["engineer", "developer", "architect", "engineering"]
# ...and none of these.
exclude_patterns = [
  "junior", "intern", "frontend", "front-end", "front end", "ios", "android", "mobile",
  "data scientist", "sales engineer", "support", "qa", "gtm",
  # Region named in the title means a restricted role even when the source
  # has no restriction data ("AI Training - LATAM", "Engineer (UK)").
  "latam", "apac", "- nz", "(nz)", "- uk", "(uk)", "- india", "(india)",
  "brazil", "canada", "- europe", "(europe)", "- eu", "(eu)",
]

[region]
# Tier 1: worldwide, or any of these words anywhere in the restriction
# text (matched as a substring, so "EMEA time zones" and "EMEA, LATAM,
# or North America" both match "emea").
tier1_keywords = ["worldwide", "global", "anywhere", "emea", "mena", "middle east"]
# Tier 1 countries: a region that includes Lebanon, or is otherwise in
# or near the GMT+3 window.
tier1_countries = [
  "Lebanon", "United Arab Emirates", "Saudi Arabia", "Qatar", "Kuwait",
  "Bahrain", "Oman", "Jordan", "Egypt", "Turkey", "Cyprus", "Greece",
  "Iraq", "Syria", "Israel", "Kenya", "Ethiopia", "South Africa",
]
# Tier 2: every restriction element is one of these (after stripping the
# word "only"), meaning the role is US-only.
tier2_keywords = ["united states", "usa", "us", "u.s.", "u.s.a."]

[remoet]
# Leave blank to use the real remoet.dev endpoint; set for tests only.
base_url = ""
# Resolves the API key at runtime. Overridden by the REMOET_API_KEY
# environment variable when set. Never printed or logged.
key_command = "~/work/taktekhq/taktekbot/bin/get remoet-nizar-mcp-key"
request_delay_ms = 300
# Stop fetching before this many of today's remoet calls are used.
budget_stop_before = 4000

[himalayas]
base_url = ""
request_delay_ms = 300
# Pages per keyword query before giving up on it even if nothing known
# has turned up yet.
max_pages = 5
queries = [
  "staff engineer", "principal engineer", "software architect",
  "engineering manager", "founding engineer", "lead engineer", "tech lead",
]
seniority_filter = ["Senior", "Manager", "Director", "Executive"]

[judge]
# The model command. Gets the prompt on stdin and must print exactly
# one JSON object on stdout, nothing else.
command = "claude -p --model haiku --tools \"\" --strict-mcp-config --disable-slash-commands"
max_per_run = 150
# If judge reports a lot of "judge failed" verdicts, or the model
# command's own error text (check text/<id>.txt and the judge log)
# mentions a huge, wrong prompt size, see the "judge failed" section
# of README.md: on one machine this traced to other, unrelated
# headless Claude sessions running at the same time, not jobpile's own
# concurrency setting, though lowering it there did not hurt.
concurrency = 4

# Entirely optional, and only read by `jobpile watch`: leave this
# whole section out if you don't use it. watch reads an IMAP mailbox
# for human replies from companies you applied to, without ever
# marking a message read or sending anything itself. See the "Watch
# for replies" section of README.md.
[watch]
imap_host = "imap.example.com"
imap_user = "you@example.com"
# Resolves the IMAP password at runtime, e.g. an app password from
# your mail provider, read from your own password manager's CLI.
# Never printed or logged.
password_command = "pass show mail/imap-app-password"
mailbox = "INBOX"
# Names or domains, matched case-insensitively as a substring against
# a message's From address, From display name, and Subject. An
# applicant-tracking system's shared sending domain (Greenhouse,
# Lever, Ashby, and similar) only matches once the company's own name
# shows up in the subject or display name, which this same check
# already covers on its own, no special case needed.
companies = ["Acme Inc", "acme.com"]
# Substrings matched case-insensitively against the Subject, to drop
# automated confirmations that are not a real reply from a person.
ignore_subjects = [
  "Security code for your application",
  "Thank you for applying",
  "Thanks for applying",
  "application was received",
  "We've received your application",
]
# Gets the notification text for one new reply on its stdin, e.g. a
# script that posts to Slack or chat, sends an email, or appends to a
# file.
notify_command = "cat >> ~/jobpile-replies.log"
# Appended as the notification's own last line, e.g. to say which
# mailbox received it. Leave blank for no footer line.
notify_footer = ""
lookback_days = 3
